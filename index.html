<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>SISTEMA DE EVOLUÇÃO</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="background-layer"></div>

    <div class="system-ui">
        <h1>SISTEMA DE MÉRITO</h1>
        <p style="color: #00ffff;">RANK: <span id="rank">E</span></p>
        
        <div class="mission-list">
            <div class="task-card" onclick="check(1, this)">1. Foco Profundo (45min)</div>
            <div class="task-card" onclick="check(2, this)">2. Treino de Elite (20min)</div>
            <div class="task-card" onclick="check(3, this)">3. Planeamento Estratégico</div>
        </div>

        <div class="inventory">
            <div class="slot" id="slot-1">?</div>
            <div class="slot" id="slot-2">?</div>
        </div>
    </div>

    <div id="victory-screen">
        <img src="vitoria.png" style="width: 80%; max-width: 600px;">
        <button onclick="location.reload()" style="margin-top:20px; background:none; border:1px solid #0ff; color:#0ff; padding:10px 20px; cursor:pointer;">FECHAR</button>
    </div>

    <script src="game.js"></script>
</body>
</html>
